<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLP Rainbow Edition Series 2 - Live Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include HTML5 QR Code Scanner Library -->
    <!-- Replace html5-qrcode script with Tesseract OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>

    <header>
        <h1>MLP: FRIENDSHIP ETERNAL</h1>
        <h2>Rainbow Edition Series 2 Tracker</h2>
        
        <div class="stats-bar">
            <span>Unique Collected: <strong id="total-owned" style="color: var(--accent-yellow);">0</strong> / 170</span>
            <button onclick="resetCounts()" class="danger-btn">Reset All</button>
            <button onclick="toggleScanner()" class="danger-btn" style="background: linear-gradient(135deg, #00c6ff, #0072ff);">📷 Open Camera Scanner</button>
        </div>

        <!-- Camera Scanner View Box -->
        <div id="scanner-container" style="display:none; margin: 15px auto; max-width: 350px; background: #120720; padding: 15px; border-radius: 12px; border: 2px solid var(--mlp-pink);">
            <div id="reader" style="width: 100%;"></div>
            <button onclick="toggleScanner()" style="margin-top: 10px; background: #ff4e50; color: #fff; border:none; padding:6px 12px; border-radius:5px; cursor:pointer; font-family:inherit;">Close Camera</button>
        </div>

        <div class="quick-entry">
            <label for="code-input">Scan/Type Card Code:</label>
            <input type="text" id="code-input" placeholder="e.g. RBE02-XR-001..." autofocus>
            <div id="feedback" class="feedback-msg"></div>
        </div>
    </header>

    <main id="rarity-container"></main>

    <!-- Bottom Analytics Dashboard -->
    <section class="analytics-dashboard">
        <h3>📊 Collection Analytics</h3>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="number" id="stat-total-cards">0</div>
                <div class="label">Total Cards Count (Inc. Duplicates)</div>
            </div>
            <div class="stat-box">
                <div class="number" id="stat-completion">0%</div>
                <div class="label">Set Completion Rate</div>
            </div>
            <div class="stat-box">
                <div class="number" id="stat-highest-rarity">None</div>
                <div class="label">Highest Rarity Collected</div>
            </div>
            <div class="stat-box">
                <div class="number" id="stat-duplicates">0</div>
                <div class="label">Total Duplicates Available for Trade</div>
            </div>
        </div>
    </section>

    <!-- Socket.io Real-Time Client -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
